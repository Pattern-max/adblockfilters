name: Update Filters
on: 
  workflow_dispatch:
  schedule:
  - cron: 0 */8 * * *

env:
  TZ: Asia/Shanghai
  SINGBOX_VERSION: 1.12.12
  MIHOMO_VERSION: 1.19.16

jobs:
  Update_Filters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      
      - name: Checkout domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gzip
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          pip install -U tld IPy dnspython httpx loguru

      - name: Update Filters
        id: update
        run: |
          python adblock.py
          rm -rf __pycache__
          rm -rf app/__pycache__
          echo "message=$(date)" >> $GITHUB_OUTPUT

      - name: Compile Sing-Box filters
        run: |
          wget https://github.com/SagerNet/sing-box/releases/download/v${{env.SINGBOX_VERSION}}/sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          tar -zxvf sing-box-${{env.SINGBOX_VERSION}}-linux-amd64.tar.gz
          chmod +x sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output rules/adblocksingbox.srs     rules/adblocksingbox.json
          ./sing-box-${{env.SINGBOX_VERSION}}-linux-amd64/sing-box rule-set compile --output rules/adblocksingboxlite.srs rules/adblocksingboxlite.json
          rm -rf sing-box*
      
      - name: Compile mihomo filters
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v${{env.MIHOMO_VERSION}}/mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          gzip -d mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}.gz
          chmod +x mihomo-linux-amd64-v${{env.MIHOMO_VERSION}}
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml rules/adblockmihomo.yaml     rules/adblockmihomo.mrs
          ./mihomo-linux-amd64-v${{env.MIHOMO_VERSION}} convert-ruleset domain yaml rules/adblockmihomolite.yaml rules/adblockmihomolite.mrs
          rm -rf mihomo*
      
      - name: Compile v2ray/xray filters
        run: |
          mkdir -p domain-list-community/adblock
          cp rules/adblockv2ray.txt domain-list-community/adblock/category-ads-all
          
          # ===== 全面清洗 category-ads-all =====
          # 1. 删除包含 ^ 的畸形域名
          sed -i '/\^/d' domain-list-community/adblock/category-ads-all
          # 2. 删除包含 / 的 CIDR 格式
          sed -i '/\//d' domain-list-community/adblock/category-ads-all
          # 3. 删除纯 IP 行（允许行首/行尾空白字符）
          grep -vE '^[[:space:]]*[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}[[:space:]]*$' domain-list-community/adblock/category-ads-all > domain-list-community/adblock/category-ads-all.tmp
          mv domain-list-community/adblock/category-ads-all.tmp domain-list-community/adblock/category-ads-all
          # 4. 删除包含双引号的行
          sed -i '/"/d' domain-list-community/adblock/category-ads-all
          # =====================================
          
          cd domain-list-community
          go run ./ --datapath=adblock
          cd ..
          cp domain-list-community/dlc.dat rules/adblockv2ray.dat
          
          mkdir -p domain-list-community/adblocklite
          cp rules/adblockv2raylite.txt domain-list-community/adblocklite/category-ads-all
          
          # ===== Lite 版同样清洗 =====
          sed -i '/\^/d' domain-list-community/adblocklite/category-ads-all
          sed -i '/\//d' domain-list-community/adblocklite/category-ads-all
          grep -vE '^[[:space:]]*[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}[[:space:]]*$' domain-list-community/adblocklite/category-ads-all > domain-list-community/adblocklite/category-ads-all.tmp
          mv domain-list-community/adblocklite/category-ads-all.tmp domain-list-community/adblocklite/category-ads-all
          sed -i '/"/d' domain-list-community/adblocklite/category-ads-all
          # =================================
          
          cd domain-list-community
          go run ./ --datapath=adblocklite
          cd ..
          cp domain-list-community/dlc.dat rules/adblockv2raylite.dat
          
          rm -rf domain-list-community
      
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.update.outputs.message }}
  
  # ============================================================
  # Refresh_CDN 已注释（因 refreshcdn.py 硬编码指向 217heidai，
  # 对 Pattern-max 项目无效，故暂时禁用）
